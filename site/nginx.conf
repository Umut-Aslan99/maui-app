server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;   # relative Location headers: no detour via http behind Traefik

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

  # Addresses of the previous version of this site: old links and cached old pages keep working.
  location = /globalpenfriends_demo.mp4 { return 301 /media/globalpenfriends-demo.mp4; }
  location = /com.umutIT.globalpenfriends.apk { return 301 /media/com.umutIT.globalpenfriends.apk; }
  location = /script.js {
    # A browser still showing the cached old page loads this and reloads into the new one.
    add_header Cache-Control "no-store";
    default_type application/javascript;
    return 200 "location.reload();\n";
  }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Demo video and APK live on a read-only volume, outside the image.
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~ \.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="GlobalPenfriends.apk"';
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
