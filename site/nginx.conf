server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Demo video and APK live on a read-only volume, outside the image.
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~ \.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="GlobalPenfriends.apk"';
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
